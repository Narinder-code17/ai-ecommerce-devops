
# GitHub Actions: lightweight CI alternative / PR gate (Jenkins remains the CD engine)
name: ci

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  build-test-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: application/package-lock.json

      - name: Install dependencies, test and audit
        run: npm ci && npm test && npm audit --audit-level=high --omit=dev
        working-directory: application

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t shopstream:ci .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shopstream:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
