# GitHub Actions: Continuous Integration and Deployment
name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  build-test-scan:
    name: Build, Test and Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: application/package-lock.json

      - name: Install dependencies, test and audit
        run: npm ci && npm test && npm audit --audit-level=high --omit=dev
        working-directory: application

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -f docker/Dockerfile -t shopstream:ci .

      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: shopstream:ci
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  deploy:
    name: Deploy to AWS EC2
    needs: build-test-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Debug GitHub OIDC claims
        shell: bash
        env:
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ secrets.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ secrets.ACTIONS_ID_TOKEN_REQUEST_URL }}
        run: |
          set -euo pipefail

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "GitHub OIDC request environment variables are unavailable."
            exit 1
          fi

          RESPONSE=$(curl -fsS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | jq -er '.value')

          python3 -c '
          import sys, json, base64

          token = sys.stdin.read().strip()
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          print(json.dumps({
              "iss": claims.get("iss"),
              "aud": claims.get("aud"),
              "sub": claims.get("sub")
          }, indent=2))
          ' <<< "$TOKEN"

          unset TOKEN RESPONSE

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy ShopStream through AWS SSM
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-03531aa6deda4e393" \
            --document-name "AWS-RunShellScript" \
            --comment "ShopStream GitHub Actions deployment" \
            --parameters '{"commands":["set -e","sudo -u ec2-user -H bash -lc \"cd /home/ec2-user/ai-ecommerce-devops && git fetch origin && if [ -f docker/ec2-compose.yml ] && ! git ls-files --error-unmatch docker/ec2-compose.yml >/dev/null 2>&1; then mv docker/ec2-compose.yml /home/ec2-user/ec2-compose.yml.backup; fi && git pull --ff-only origin develop && docker compose --env-file .env -p docker -f docker/ec2-compose.yml config --quiet && docker compose --env-file .env -p docker -f docker/ec2-compose.yml up -d --build\"","for i in $(seq 1 30); do if curl -fsS http://localhost/health >/dev/null; then echo \"ShopStream health check passed\"; exit 0; fi; sleep 5; done","echo \"ShopStream health check failed\"","docker compose --env-file /home/ec2-user/ai-ecommerce-devops/.env -p docker -f /home/ec2-user/ai-ecommerce-devops/docker/ec2-compose.yml ps","exit 1"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "i-03531aa6deda4e393" \
              --query "Status" \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "i-03531aa6deda4e393" \
                  --query "StandardOutputContent" \
                  --output text
                echo "ShopStream deployment successful!"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "i-03531aa6deda4e393" \
                  --output json
                exit 1
                ;;
            esac

            sleep 5
          done

          echo "Deployment polling timed out."
          exit 1
