- name: Install k3s (single-node Kubernetes with Traefik ingress)
  ansible.builtin.shell: curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION={{ k3s_version }} sh -
  args:
    creates: /usr/local/bin/k3s
- name: Wait for node Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=120s
  changed_when: false
- name: Install Helm
  ansible.builtin.shell: curl -fsSL {{ helm_install_url }} | bash
  args:
    creates: /usr/local/bin/helm
- name: Copy kubeconfig for app user
  ansible.builtin.copy:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "/home/{{ app_user }}/.kube-config"
    remote_src: true
    owner: "{{ app_user }}"
    mode: "0600"
