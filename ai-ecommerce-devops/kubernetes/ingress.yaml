apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: shopstream, namespace: shopstream }
spec:
  # k3s ships Traefik (class "traefik"); change to "nginx" on clusters using ingress-nginx
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: shopstream, port: { number: 80 } } } }
