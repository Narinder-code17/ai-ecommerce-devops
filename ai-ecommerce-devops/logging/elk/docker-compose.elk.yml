# ELK + Filebeat. Needs ~4GB RAM. Run:
#   docker compose -f docker/docker-compose.yml -f logging/elk/docker-compose.elk.yml up -d
# (security is disabled for local learning only - enable xpack security for real use)
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes: ["esdata:/usr/share/elasticsearch/data"]
    networks: [shop]
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.0
    volumes: ["../logging/elk/logstash.conf:/usr/share/logstash/pipeline/logstash.conf:ro"]
    depends_on: [elasticsearch]
    networks: [shop]
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    environment: { ELASTICSEARCH_HOSTS: "http://elasticsearch:9200" }
    ports: ["5601:5601"]
    depends_on: [elasticsearch]
    networks: [shop]
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ../logging/elk/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [logstash]
    networks: [shop]
volumes: { esdata: {} }
