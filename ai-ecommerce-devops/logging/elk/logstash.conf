input { beats { port => 5044 } }
filter {
  # app logs are JSON lines; parse them when possible
  json { source => "message" target => "app" skip_on_invalid_json => true }
  if [app][level] { mutate { add_field => { "log_level" => "%{[app][level]}" } } }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "shopstream-logs-%{+YYYY.MM.dd}"
  }
}
