- name: Install base packages
  ansible.builtin.apt:
    name: [curl, git, jq, ufw, fail2ban, unattended-upgrades, ca-certificates]
    update_cache: true
- name: Create application user
  ansible.builtin.user:
    name: "{{ app_user }}"
    shell: /bin/bash
    groups: sudo
    append: true
- name: Create application directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    mode: "0755"
- name: Harden SSH (no root login, no passwords)
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "^#?{{ item.k }}"
    line: "{{ item.k }} {{ item.v }}"
    validate: sshd -t -f %s
  loop:
    - { k: PermitRootLogin, v: "no" }
    - { k: PasswordAuthentication, v: "no" }
  notify: restart sshd
- name: Allow required ports (before enabling firewall so SSH is not cut off)
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: ["22", "80", "443", "6443"]
- name: Enable firewall, deny other inbound
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
- name: Enable fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
