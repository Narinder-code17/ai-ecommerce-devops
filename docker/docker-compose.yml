
# Local multi-service environment: nginx -> app -> postgres, plus monitoring.
# Run from repo root:
# docker compose -f docker/docker-compose.yml -f docker/docker-compose.override.yml up -d --build

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on:
      - app
    networks:
      - shop
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: shopstream:local
    environment:
      APP_ENV: local
      PORT: "3000"
      DATABASE_URL: "postgres://shop:${DB_PASSWORD:-shop_dev_pw}@db:5432/shop"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shop
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: "${DB_PASSWORD:-shop_dev_pw}"
      POSTGRES_DB: shop
    volumes:
      - "pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - shop
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: "postgresql://shop:${DB_PASSWORD:-shop_dev_pw}@db:5432/shop?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - shop
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9090:9090"
    volumes:
      - "../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - "../monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro"
    depends_on:
      - postgres-exporter
    networks:
      - shop
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_PASSWORD:-admin_change_me}"
    volumes:
      - "../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro"
      - "../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro"
    depends_on:
      - prometheus
    networks:
      - shop
    restart: unless-stopped

volumes:
  pgdata: {}

networks:
  shop: {}
