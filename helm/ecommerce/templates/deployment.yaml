apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ include "ecommerce.name" . }}, labels: { app: {{ include "ecommerce.name" . }} } }
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app: {{ include "ecommerce.name" . }} } }
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  template:
    metadata:
      labels: { app: {{ include "ecommerce.name" . }} }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "3000", prometheus.io/path: /metrics }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 100 }
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: {{ .Values.service.targetPort }} }]
          envFrom:
            - configMapRef: { name: {{ include "ecommerce.name" . }}-config }
            {{- if .Values.secret.DATABASE_URL }}
            - secretRef: { name: {{ include "ecommerce.name" . }}-secret }
            {{- end }}
          readinessProbe: { httpGet: { path: /health, port: {{ .Values.service.targetPort }} }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /health, port: {{ .Values.service.targetPort }} }, initialDelaySeconds: 15, periodSeconds: 10 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
