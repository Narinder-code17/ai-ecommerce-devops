apiVersion: apps/v1
kind: Deployment
metadata: { name: shopstream, namespace: shopstream, labels: { app: shopstream } }
spec:
  replicas: 3
  selector: { matchLabels: { app: shopstream } }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app: shopstream }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "3000", prometheus.io/path: /metrics }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 100, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: YOUR_DOCKERHUB_USER/shopstream:latest
          ports: [{ containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: shopstream-config }
            # secretRef is optional so the demo works without a DB; remove 'optional' in prod
            - secretRef: { name: shopstream-secret, optional: true }
          readinessProbe: { httpGet: { path: /health, port: 3000 }, initialDelaySeconds: 5, periodSeconds: 5 }
          livenessProbe:  { httpGet: { path: /health, port: 3000 }, initialDelaySeconds: 15, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
