apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: shopstream, namespace: shopstream }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: shopstream }
  minReplicas: 3
  maxReplicas: 8
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
