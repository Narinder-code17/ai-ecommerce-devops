# TEMPLATE ONLY. Never commit real credentials. Create the real one with:
#   kubectl -n shopstream create secret generic shopstream-secret \
#     --from-literal=DATABASE_URL='postgres://shop:REALPASS@db:5432/shop'
apiVersion: v1
kind: Secret
metadata: { name: shopstream-secret, namespace: shopstream }
type: Opaque
stringData:
  DATABASE_URL: "postgres://shop:CHANGE_ME@db:5432/shop"
