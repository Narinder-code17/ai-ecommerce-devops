# Canary: same Service selector (app: shopstream) matches both Deployments,
# so ~1/(3+1)=25% of traffic hits the canary. Scale canary up/down to shift traffic.
apiVersion: apps/v1
kind: Deployment
metadata: { name: shopstream-canary, namespace: shopstream }
spec:
  replicas: 1
  selector: { matchLabels: { app: shopstream, track: canary } }
  template:
    metadata: { labels: { app: shopstream, track: canary } }
    spec:
      containers:
        - { name: app, image: YOUR_DOCKERHUB_USER/shopstream:NEW_TAG, ports: [{ containerPort: 3000 }] }
