global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]
  # docker-compose: app container
  - job_name: shopstream
    metrics_path: /metrics
    static_configs: [{ targets: ["app:3000"] }]
  # Kubernetes: discover pods annotated prometheus.io/scrape=true
  # (use this block instead when Prometheus runs in the cluster)
  # - job_name: shopstream-k8s
  #   kubernetes_sd_configs: [{ role: pod }]
  #   relabel_configs:
  #     - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape], action: keep, regex: "true" }
  #     - { source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path], action: replace, target_label: __metrics_path__, regex: (.+) }
